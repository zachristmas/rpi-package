[package]
name = "rpi-mcp-adapter"
version = "0.2.4"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Session-scoped stdio and Streamable HTTP MCP adapter for the rpi Rust agent"
readme = "README.md"
keywords = ["rpi", "mcp", "json-rpc", "plugin"]
categories = ["development-tools"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Pinned: 0.3.24 made StbString accessors unsafe, which this crate predates, and
# `rpi install --path` builds in a temp dir without the workspace lockfile.
rpi-plugin-sdk = { version = "=0.3.20", features = ["process"] }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true, features = ["macros", "net"] }
url = { workspace = true }
